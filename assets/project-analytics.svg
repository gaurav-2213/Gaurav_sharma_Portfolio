<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#18182f"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgA)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#1e1b4b" opacity="0.6"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">DevPulse • Real-Time Cloud Telemetry</text>

  <!-- Metric KPI Cards -->
  <g transform="translate(40, 60)">
    <rect width="155" height="70" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
    <text x="16" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total API Requests</text>
    <text x="16" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold">1.42M</text>
    <text x="135" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">+18.4%</text>
  </g>

  <g transform="translate(220, 60)">
    <rect width="155" height="70" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
    <text x="16" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Avg Latency (p99)</text>
    <text x="16" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold">28ms</text>
    <text x="135" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">-4.2%</text>
  </g>

  <g transform="translate(400, 60)">
    <rect width="160" height="70" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
    <text x="16" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Global Uptime</text>
    <text x="16" y="52" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold">99.98%</text>
    <circle cx="140" cy="46" r="5" fill="#34d399"/>
  </g>

  <!-- Big Interactive Area Chart -->
  <g transform="translate(40, 150)">
    <rect width="520" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <line x1="20" y1="40" x2="500" y2="40" stroke="#1e293b" stroke-dasharray="3 3"/>
    <line x1="20" y1="80" x2="500" y2="80" stroke="#1e293b" stroke-dasharray="3 3"/>
    <line x1="20" y1="120" x2="500" y2="120" stroke="#1e293b" stroke-dasharray="3 3"/>

    <!-- Chart Fill & Stroke -->
    <path d="M 20 120 Q 80 90, 140 100 T 260 50 T 380 70 T 500 30 L 500 150 L 20 150 Z" fill="url(#chartGrad)"/>
    <path d="M 20 120 Q 80 90, 140 100 T 260 50 T 380 70 T 500 30" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Active Datapoint Pin -->
    <circle cx="380" cy="70" r="5" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>
    <rect x="345" y="25" width="70" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="380" y="42" fill="#e0e7ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">38.4k req/s</text>

    <!-- Bottom X Labels -->
    <text x="40" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">00:00</text>
    <text x="160" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">06:00</text>
    <text x="280" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">12:00</text>
    <text x="400" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">18:00</text>
    <text x="480" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">NOW</text>
  </g>
</svg>