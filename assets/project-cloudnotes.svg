    <text x="25" y="132" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">const sync = () =&gt; {</text>
    <text x="35" y="148" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">  return db.p2p();</text>
    <text x="25" y="164" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">};</text>

    <rect x="15" y="185" width="3" height="35" fill="#6366f1"/>
    <text x="25" y="205" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" font-size="9.5">CRDT offline sync</text>
