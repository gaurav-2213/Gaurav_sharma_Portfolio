<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#191924"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgE)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#1e293b" opacity="0.6"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">AuraShop • Headless Next.js Commerce + Stripe</text>

  <!-- Storefront Header inside preview -->
  <g transform="translate(35, 60)">
    <rect width="530" height="40" rx="8" fill="#1e293b"/>
    <text x="20" y="25" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="14">AURASTORE</text>
    <rect x="150" y="10" width="220" height="22" rx="11" fill="#0f172a"/>
    <text x="170" y="25" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Search 20,000+ items...</text>
    <rect x="440" y="9" width="75" height="24" rx="6" fill="#2563eb"/>
    <text x="477" y="25" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cart (3)</text>
  </g>

  <!-- Product Cards Grid -->
  <g transform="translate(35, 115)">
    <!-- Product 1 -->
    <rect width="160" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="90" rx="8" fill="#1e293b"/>
    <circle cx="80" cy="60" r="28" fill="#3b82f6" opacity="0.3"/>
    <text x="80" y="65" fill="#60a5fa" font-family="monospace" font-size="12" text-anchor="middle">DEVICE</text>
    <text x="15" y="125" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">Ultra Pro ANC Pods</text>
    <text x="15" y="142" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Spatial Audio • USB-C</text>
    <text x="15" y="172" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13">$149</text>
    <rect x="90" y="157" width="55" height="24" rx="5" fill="#2563eb"/>
    <text x="117" y="173" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add</text>

    <!-- Product 2 -->
    <g transform="translate(185, 0)">
      <rect width="160" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="130" height="90" rx="8" fill="#1e293b"/>
      <circle cx="80" cy="60" r="28" fill="#10b981" opacity="0.3"/>
      <text x="80" y="65" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">WATCH</text>
      <text x="15" y="125" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">Smart Chrono V</text>
      <text x="15" y="142" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Titanium • BioSensor</text>
      <text x="15" y="172" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13">$299</text>
      <rect x="90" y="157" width="55" height="24" rx="5" fill="#2563eb"/>
      <text x="117" y="173" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(370, 0)">
      <rect width="160" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="130" height="90" rx="8" fill="#1e293b"/>
      <circle cx="80" cy="60" r="28" fill="#f59e0b" opacity="0.3"/>
      <text x="80" y="65" fill="#fbbf24" font-family="monospace" font-size="12" text-anchor="middle">KEYBOARD</text>
      <text x="15" y="125" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">Cyber Mechanical 75</text>
      <text x="15" y="142" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Gateron Yellow • RGB</text>
      <text x="15" y="172" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13">$119</text>
      <rect x="90" y="157" width="55" height="24" rx="5" fill="#2563eb"/>
      <text x="117" y="173" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add</text>
    </g>
