<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgAI)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#2e1065" opacity="0.6"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">NeuralDoc • RAG Vector Embeddings &amp; LLM Assistant</text>

  <!-- Left Chat Stream -->
  <g transform="translate(30, 65)">
    <!-- User Prompt bubble -->
    <rect x="90" y="0" width="220" height="46" rx="12" fill="#3b0764" stroke="#6b21a8" stroke-width="1"/>
    <text x="105" y="20" fill="#f3e8ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Summarize security audit results</text>
    <text x="105" y="36" fill="#d8b4fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">from uploaded Q3 CVE documents.</text>
    
    <!-- AI Response bubble -->
    <rect x="0" y="60" width="310" height="110" rx="12" fill="#0f172a" stroke="#4c1d95" stroke-width="1"/>
    <circle cx="20" cy="80" r="10" fill="url(#purpleG)"/>
    <text x="20" y="84" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">AI</text>
    <text x="38" y="82" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold">Vector Match: Cosine 0.94</text>
    <text x="16" y="105" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Detected 3 high-severity permission leaks</text>
    <text x="16" y="125" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Zero-day vulnerability mitigation patched</text>
    <text x="16" y="145" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• FAISS index latency: 12ms</text>

    <!-- Query Prompt Box -->
    <rect x="0" y="190" width="310" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="16" y="216" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Ask question across 50,000+ papers...</text>
    <rect x="250" y="196" width="50" height="30" rx="6" fill="#7c3aed"/>
    <text x="275" y="215" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Send</text>
  </g>

  <!-- Right Neural / Embedding Matrix Visualization -->
  <g transform="translate(370, 75)">
    <rect width="200" height="235" rx="12" fill="#0f172a" stroke="#3b0764" stroke-width="1.5"/>
    <text x="100" y="28" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Embedding Vector Space</text>

    <!-- Connective lines -->
    <line x1="40" y1="70" x2="100" y2="120" stroke="#7e22ce" stroke-width="1.5"/>
    <line x1="160" y1="70" x2="100" y2="120" stroke="#7e22ce" stroke-width="1.5"/>
    <line x1="100" y1="120" x2="60" y2="180" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="100" y1="120" x2="140" y2="175" stroke="#ec4899" stroke-width="1.5"/>
    <line x1="40" y1="70" x2="160" y2="70" stroke="#4c1d95" stroke-dasharray="2 3"/>

    <!-- Nodes -->
    <circle cx="40" cy="70" r="14" fill="#6b21a8"/>
    <text x="40" y="74" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">D1</text>

    <circle cx="160" cy="70" r="14" fill="#6b21a8"/>
    <text x="160" y="74" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">D2</text>

    <circle cx="100" cy="120" r="20" fill="url(#purpleG)"/>
    <text x="100" y="125" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">RAG</text>

    <circle cx="60" cy="180" r="12" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <circle cx="140" cy="175" r="12" fill="#3b0764" stroke="#ec4899" stroke-width="2"/>

    <rect x="25" y="208" width="150" height="20" rx="4" fill="#1e1b4b"/>
    <text x="100" y="222" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Pinecone + LangChain</text>
  </g>
</svg>