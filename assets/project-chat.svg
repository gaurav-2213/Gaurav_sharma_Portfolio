<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#chatBg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#1e293b" opacity="0.7"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">NetworkChat • Socket.io Bi-Directional Stream</text>

  <!-- Left Sidebar (Channels / Users) -->
  <g transform="translate(30, 60)">
    <rect width="140" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">ACTIVE CHANNELS</text>
    
    <rect x="8" y="38" width="124" height="28" rx="5" fill="#1e293b"/>
    <circle cx="20" cy="52" r="3.5" fill="#10b981"/>
    <text x="32" y="56" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11"># general-dev</text>

    <circle cx="20" cy="85" r="3.5" fill="#10b981"/>
    <text x="32" y="89" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11"># algorithms</text>

    <circle cx="20" cy="115" r="3.5" fill="#64748b"/>
    <text x="32" y="119" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11"># system-arch</text>

    <rect x="8" y="225" width="124" height="26" rx="5" fill="#1e1b4b"/>
    <text x="70" y="242" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">MySQL Persisted</text>
  </g>

  <!-- Main Chat Window (Right) -->
  <g transform="translate(185, 60)">
    <rect width="385" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Header inside window -->
    <rect width="385" height="35" rx="8 8 0 0" fill="#1e293b" opacity="0.6"/>
    <text x="15" y="22" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12"># general-dev (Socket.io Ping: 4ms)</text>
    <circle cx="360" cy="18" r="4" fill="#10b981"/>

    <!-- Messages -->
    <!-- Message 1 from peer -->
    <rect x="15" y="48" width="220" height="42" rx="10" fill="#1e293b"/>
    <text x="25" y="65" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="bold">DevPeer_42</text>
    <text x="25" y="81" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Client-server socket handshake verified!</text>

    <!-- Message 2 from Gaurav -->
    <rect x="140" y="100" width="230" height="42" rx="10" fill="#2563eb"/>
    <text x="152" y="117" fill="#bfdbfe" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="bold">Gaurav Sharma</text>
    <text x="152" y="133" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">MySQL persistent history loaded successfully.</text>

    <!-- Message 3 from peer -->
    <rect x="15" y="152" width="240" height="42" rx="10" fill="#1e293b"/>
    <text x="25" y="169" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="bold">DevPeer_42</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Zero latency across concurrent nodes. 🚀</text>

    <!-- Input Box -->
    <rect x="15" y="215" width="355" height="40" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="28" y="240" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Type message and broadcast...</text>
    <rect x="315" y="222" width="45" height="26" rx="4" fill="#0284c7"/>
    <text x="337" y="239" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">SEND</text>
  </g>
</svg>