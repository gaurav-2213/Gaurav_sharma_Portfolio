<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgAlg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141e2a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgAlg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#1e293b" opacity="0.6"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">AlgoLab • Interactive Sorting &amp; Graph Pathfinder</text>

  <!-- Controls Bar -->
  <g transform="translate(40, 60)">
    <rect width="520" height="40" rx="8" fill="#1e293b"/>
    <rect x="15" y="8" width="80" height="24" rx="4" fill="#0284c7"/>
