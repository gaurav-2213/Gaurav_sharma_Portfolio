<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="weaponBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1c1118"/>
    </linearGradient>
    <linearGradient id="alertG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#weaponBg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect width="600" height="42" fill="#1e293b" opacity="0.7"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="300" y="26" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">VisionSentry • OpenCV + TensorFlow Real-Time Detection</text>

  <!-- Camera Live Feed Simulation -->
  <g transform="translate(35, 60)">
    <rect width="340" height="265" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Camera Overlay elements -->
    <text x="18" y="25" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">● LIVE FEED [CAM_04 - ENTRANCE]</text>
    <text x="320" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">30 FPS</text>

    <!-- Grid Crosshairs -->
    <line x1="170" y1="40" x2="170" y2="240" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="140" x2="320" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Detected Object Bounding Box (OpenCV / TensorFlow) -->
    <rect x="75" y="70" width="190" height="150" rx="4" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Corner brackets -->
    <path d="M70 85 L70 65 L90 65" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M250 65 L270 65 L270 85" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M70 205 L70 225 L90 225" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M250 225 L270 225 L270 205" stroke="#ef4444" stroke-width="3" fill="none"/>

    <!-- Detection Tag Label -->
    <rect x="75" y="46" width="140" height="24" rx="4" fill="#ef4444"/>
    <text x="82" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold">THREAT: 97.8% CONF</text>

    <!-- Simulated Target Outline inside bounding box -->
    <circle cx="170" cy="115" r="22" fill="#334155" opacity="0.6"/>
    <path d="M140 180 C140 145 155 140 170 140 C185 140 200 145 200 180 Z" fill="#1e293b"/>
    <rect x="185" y="130" width="35" height="16" rx="2" fill="#ef4444" opacity="0.9"/>
  </g>

  <!-- Right Side Analytics Panel -->
  <g transform="translate(395, 60)">
    <rect width="175" height="265" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="28" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">Telemetry Status</text>

    <!-- Inference Latency -->
    <rect x="15" y="42" width="145" height="50" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="24" y="58" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Inference Speed</text>
    <text x="24" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">18 ms</text>

    <!-- Model Confidence -->
    <rect x="15" y="102" width="145" height="50" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="24" y="118" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Model Accuracy</text>
    <text x="24" y="140" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">98.2%</text>

    <!-- Targeted Frameworks -->
    <rect x="15" y="162" width="145" height="50" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="24" y="178" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Architecture</text>
    <text x="24" y="198" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">YOLO + TensorFlow</text>

    <!-- Security Trigger Badge -->
    <rect x="15" y="222" width="145" height="28" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="87" y="240" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" text-anchor="middle">🚨 ALERT DISPATCHED</text>
  </g>
</svg>