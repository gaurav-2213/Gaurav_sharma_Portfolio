    <rect x="25" y="140" width="16" height="50" rx="3" fill="#38bdf8"/>
    <rect x="46" y="110" width="16" height="80" rx="3" fill="#38bdf8"/>
    <rect x="67" y="160" width="16" height="30" rx="3" fill="#38bdf8"/>
    <rect x="88" y="90" width="16" height="100" rx="3" fill="#38bdf8"/>
    <rect x="109" y="130" width="16" height="60" rx="3" fill="#38bdf8"/>
    <rect x="130" y="70" width="16" height="120" rx="3" fill="#38bdf8"/>
    <rect x="151" y="150" width="16" height="40" rx="3" fill="#38bdf8"/>

    <!-- Active Swapping Bars in Red/Amber -->
    <rect x="172" y="40" width="16" height="150" rx="3" fill="#ef4444"/>
    <rect x="193" y="120" width="16" height="70" rx="3" fill="#f59e0b"/>

    <!-- Sorted Bars in Emerald Green -->
    <rect x="214" y="60" width="16" height="130" rx="3" fill="#10b981"/>
    <rect x="235" y="80" width="16" height="110" rx="3" fill="#10b981"/>
    <rect x="256" y="95" width="16" height="95" rx="3" fill="#10b981"/>
    <rect x="277" y="105" width="16" height="85" rx="3" fill="#10b981"/>
    <rect x="298" y="125" width="16" height="65" rx="3" fill="#38bdf8"/>
    <rect x="319" y="50" width="16" height="140" rx="3" fill="#38bdf8"/>
    <rect x="340" y="145" width="16" height="45" rx="3" fill="#38bdf8"/>
    <rect x="361" y="30" width="16" height="160" rx="3" fill="#6366f1"/>
    <rect x="382" y="100" width="16" height="90" rx="3" fill="#38bdf8"/>
    <rect x="403" y="135" width="16" height="55" rx="3" fill="#38bdf8"/>
    <rect x="424" y="85" width="16" height="105" rx="3" fill="#38bdf8"/>
    <rect x="445" y="45" width="16" height="145" rx="3" fill="#38bdf8"/>
    <rect x="466" y="115" width="16" height="75" rx="3" fill="#38bdf8"/>

