    <rect x="105" y="8" width="70" height="24" rx="4" fill="#334155"/>
    <text x="140" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">RESET</text>
    
    <text x="210" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Algorithm: QuickSort | Comparisons: 1,420 | Swaps: 812</text>
  </g>

  <!-- Sorting Bar Visualization Canvas -->
  <g transform="translate(40, 115)">
    <rect width="520" height="205" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Visualized bars representing array elements -->
