<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Circle with Glow -->
  <circle cx="120" cy="120" r="105" fill="url(#avatarBg)" filter="url(#shadow)"/>
  <circle cx="120" cy="120" r="100" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="120" cy="120" r="112" stroke="url(#glowG)" stroke-width="2" stroke-dasharray="10 14" opacity="0.7"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Body -->
  <path d="M60 210 C60 168 85 155 120 155 C155 155 180 168 180 210 Z" fill="#0f172a" opacity="0.95"/>
  <path d="M75 210 C75 178 95 168 120 168 C145 168 165 178 165 210 Z" fill="#1e293b"/>
  
  <!-- Hoodie Collar / T-Shirt -->
  <path d="M100 168 L120 192 L140 168 Z" fill="#6366f1"/>
  
  <!-- Neck -->
  <rect x="110" y="132" width="20" height="26" rx="5" fill="#fbcfe8"/>
  
  <!-- Head -->
  <ellipse cx="120" cy="105" rx="34" ry="40" fill="#fed7aa"/>
  
  <!-- Modern Hair -->
  <path d="M84 100 C82 72 98 56 120 56 C144 56 158 72 156 100 C151 90 142 86 134 88 C124 82 108 82 98 88 C90 86 86 92 84 100 Z" fill="#0f172a"/>
  
  <!-- Eyeglasses -->
  <rect x="94" y="98" width="22" height="15" rx="4" fill="rgba(15,23,42,0.8)" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="124" y="98" width="22" height="15" rx="4" fill="rgba(15,23,42,0.8)" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="116" y1="105" x2="124" y2="105" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="88" y1="104" x2="94" y2="104" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="146" y1="104" x2="152" y2="104" stroke="#38bdf8" stroke-width="2.5"/>
  
  <!-- Smirk / Smile -->
  <path d="M112 125 Q120 131 128 125" stroke="#7c2d12" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  
  <!-- Floating Code Badges -->
  <g transform="translate(20, 48)">
    <rect width="44" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="22" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>
  </g>
  <g transform="translate(175, 145)">
    <rect width="46" height="24" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="23" y="16" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ML•AI</text>
  </g>
</svg>