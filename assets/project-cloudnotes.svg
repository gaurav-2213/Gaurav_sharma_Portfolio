    <text x="12" y="72" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">- High availability</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">- End-to-end AES-256</text>
    <text x="12" y="110" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9.5">```ts</text>
    <text x="16" y="128" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">const sync = () =&gt; {</text>
    <text x="24" y="146" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">  return db.p2p()</text>
    <text x="16" y="164" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">};</text>
    <text x="12" y="182" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9.5">```</text>
    <text x="12" y="206" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">&gt; CRDT offline sync</text>
